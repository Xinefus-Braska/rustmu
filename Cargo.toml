[workspace]
resolver = "3"
members = [
    "crates/rustmu-server",
    "crates/rustmu-sdk",
    "crates/rustmu-cli",
    "crates/rustmu-portal",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
