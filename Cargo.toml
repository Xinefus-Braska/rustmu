[workspace]
resolver = "3"
members = [
    "crates/rustmu-server",
    "crates/rustmu-sdk",
    "crates/rustmu-cli",
    "crates/rustmu-portal",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Xinefus-Braska/rustmu"
rust-version = "1.85"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
